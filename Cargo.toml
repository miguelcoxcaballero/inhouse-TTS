[workspace]
resolver = "2"
members = ["crates/inhouse-tts-core", "crates/inhouse-tts-text", "crates/inhouse-tts", "crates/inhouse-tts-cli", "crates/inhouse-tts-web", "crates/inhouse-tts-android", "crates/xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/miguelcoxcaballero/inhouse-TTS"
homepage = "https://miguelcoxcaballero.github.io/inhouse-TTS/"
authors = ["Inhouse TTS contributors"]
rust-version = "1.87"

[workspace.dependencies]
inhouse-tts-core = { path = "crates/inhouse-tts-core", default-features = false }
inhouse-tts-text = { path = "crates/inhouse-tts-text", default-features = false }
inhouse-tts = { path = "crates/inhouse-tts", default-features = false }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

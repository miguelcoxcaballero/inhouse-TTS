name: Web demo (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: 0.2.129
  # Pinned Kokoro-82M v1.0 revision (Apache-2.0): English voices.
  KOKORO_REV: f3ff3571791e39611d31c381e3a41a3af07b4987
  # Pinned rhasspy/piper-voices revision (MIT): Spanish voices.
  PIPER_REV: 5041a7a49ae5b3a0f30e6837769eb03fdbb231bd

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Cache wasm-bindgen CLI
        id: wbg
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-${{ env.WASM_BINDGEN_VERSION }}
      - name: Install wasm-bindgen CLI
        if: steps.wbg.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version ${{ env.WASM_BINDGEN_VERSION }} --locked
      - name: Cache Kokoro-82M checkpoint
        id: kokoro
        uses: actions/cache@v4
        with:
          path: kokoro
          key: kokoro-${{ env.KOKORO_REV }}-en-v1
      - name: Download Kokoro-82M (Apache-2.0)
        if: steps.kokoro.outputs.cache-hit != 'true'
        run: |
          set -e
          base="https://huggingface.co/hexgrad/Kokoro-82M/resolve/${KOKORO_REV}"
          mkdir -p kokoro/voices
          curl -fsSL --retry 5 -o kokoro/config.json "$base/config.json"
          curl -fsSL --retry 5 -o kokoro/kokoro-v1_0.pth "$base/kokoro-v1_0.pth"
          for v in af_alloy af_aoede af_bella af_heart af_jessica af_kore af_nicole af_nova af_river af_sarah af_sky \
                   am_adam am_echo am_eric am_fenrir am_liam am_michael am_onyx am_puck am_santa \
                   bf_alice bf_emma bf_isabella bf_lily bm_daniel bm_fable bm_george bm_lewis; do
            curl -fsSL --retry 5 -o "kokoro/voices/$v.pt" "$base/voices/$v.pt"
          done
      - name: Cache Piper voices
        id: piper
        uses: actions/cache@v4
        with:
          path: piper
          key: piper-${{ env.PIPER_REV }}-v1
      - name: Download Piper voices (MIT)
        if: steps.piper.outputs.cache-hit != 'true'
        run: |
          set -e
          base="https://huggingface.co/rhasspy/piper-voices/resolve/${PIPER_REV}"
          mkdir -p piper
          for v in es/es_ES/davefx/medium/es_ES-davefx-medium \
                   es/es_ES/sharvard/medium/es_ES-sharvard-medium \
                   es/es_MX/ald/medium/es_MX-ald-medium \
                   es/es_AR/daniela/high/es_AR-daniela-high; do
            f=$(basename "$v")
            curl -fsSL --retry 5 -o "piper/$f.onnx" "$base/$v.onnx"
            curl -fsSL --retry 5 -o "piper/$f.onnx.json" "$base/$v.onnx.json"
          done
      - name: Build the site (Rust → WebAssembly, model conversion)
        run: cargo xtask web --kokoro kokoro --piper piper --out web/dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

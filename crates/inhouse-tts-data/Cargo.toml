[package]
name = "inhouse-tts-data"
description = "Training data tooling for Inhouse TTS: download, decode, resample, normalise, trim and phonemise speech corpora"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "ihtts-data"
path = "src/main.rs"

[dependencies]
inhouse-tts-text = { workspace = true, features = ["embed-lexicons"] }
symphonia = { version = "0.6", default-features = false, features = ["mp3", "flac", "wav", "ogg", "mkv", "vorbis", "pcm", "adpcm"] }
opus-decoder = "0.1"
rubato = "5"
hound = "3.5"
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
bytes = "1"
parquet = { version = "60", default-features = false, features = ["snap"] }
csv = "1"
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
